# Single-host deployment: PostgreSQL + API (serving the web app). Put a TLS-terminating reverse proxy in front.
#   cp .env.example .env     (set real secrets and ALLOWED_ORIGINS=https://your.domain)
#   docker compose up -d db
#   docker compose run --rm migrate
#   docker compose up -d api
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      APEX_OWNER_PASSWORD: ${APEX_OWNER_PASSWORD:?set APEX_OWNER_PASSWORD}
      APEX_APP_PASSWORD: ${APEX_APP_PASSWORD:?set APEX_APP_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/db-setup.sh:/scripts/db-setup.sh:ro
      - ./scripts/docker-db-init.sh:/docker-entrypoint-initdb.d/10-apex-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://apex_owner:${APEX_OWNER_PASSWORD}@db:5432/apexoutbox
    command: ["node", "server/dist/db/migrate-cli.js"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://apex_app:${APEX_APP_PASSWORD}@db:5432/apexoutbox
    volumes:
      - invoices:/data/invoices
    ports:
      - "127.0.0.1:3000:3000"   # expose only to the reverse proxy on the same host

volumes:
  pg-data:
  invoices:
